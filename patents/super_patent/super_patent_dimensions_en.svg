  <!-- Step 2: Correlation Calculation -->
  <rect x="440" y="490" width="340" height="140" fill="rgba(139,69,19,0.1)" rx="10" stroke="#a16207" stroke-width="2"/>
  <text x="610" y="515" text-anchor="middle" fill="#92400e" font-size="16" font-weight="bold">
    Step 2: Correlation Calculation
  </text>
  <text x="450" y="540" fill="#78350f" font-size="11" font-family="monospace">
    correlations = []
  </text>
  <text x="450" y="555" fill="#78350f" font-size="11" font-family="monospace">
    for i, j in combinations:
  </text>
  <text x="450" y="570" fill="#78350f" font-size="11" font-family="monospace">
        correlation = abs(
  </text>
  <text x="450" y="585" fill="#78350f" font-size="11" font-family="monospace">
            field_strengths[i] -
  </text>
  <text x="450" y="600" fill="#78350f" font-size="11" font-family="monospace">
