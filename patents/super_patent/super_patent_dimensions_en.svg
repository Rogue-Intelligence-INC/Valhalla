  <!-- Step 1: Field Strength Analysis -->
  <rect x="80" y="490" width="340" height="140" fill="rgba(16,185,129,0.1)" rx="10" stroke="#10b981" stroke-width="2"/>
  <text x="250" y="515" text-anchor="middle" fill="#059669" font-size="16" font-weight="bold">
    Step 1: Field Strength Analysis
  </text>
  <text x="90" y="540" fill="#064e3b" font-size="11" font-family="monospace">
    field_strengths = [field.strength
  </text>
  <text x="90" y="555" fill="#064e3b" font-size="11" font-family="monospace">
                    for field in field_data]
  </text>
  <text x="90" y="575" fill="#064e3b" font-size="11">
