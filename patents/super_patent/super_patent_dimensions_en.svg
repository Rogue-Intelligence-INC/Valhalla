  </text>
  <text x="810" y="575" fill="#7f1d1d" font-size="11" font-family="monospace">
    estimated_dimension = 1.0 +
  </text>
  <text x="810" y="590" fill="#7f1d1d" font-size="11" font-family="monospace">
        avg_correlation *
  </text>
  <text x="810" y="605" fill="#7f1d1d" font-size="11" font-family="monospace">
        math.log(len(field_data))
  </text>
  <text x="810" y="625" fill="#7f1d1d" font-size="11">
    Apply Hausdorff dimension estimation formula
  </text>
  
