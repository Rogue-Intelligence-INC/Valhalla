<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 1 - SYSTEM ARCHITECTURE OVERVIEW</text>
  
  <!-- Main System Box -->
  <rect x="50" y="50" width="700" height="420" fill="none" stroke="black" stroke-width="2"/>
  <text x="400" y="75" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle">UNIFIED WEIGHTED SIGNAL COORDINATION SYSTEM (100)</text>
  
  <!-- Signal Sources (Left Side) -->
  <rect x="70" y="120" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="130" y="145" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Signal Source</text>
  <text x="130" y="162" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">A (110a)</text>
  
  <rect x="70" y="200" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="130" y="225" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Signal Source</text>
  <text x="130" y="242" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">B (110b)</text>
  
  <rect x="70" y="280" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="130" y="305" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Signal Source</text>
  <text x="130" y="322" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">C (110c)</text>
  
  <rect x="70" y="360" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="130" y="385" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Signal Source</text>
  <text x="130" y="402" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">N (110n)</text>
  
  <!-- Dots between C and N -->
  <text x="130" y="355" font-family="Times New Roman, serif" font-size="14" text-anchor="middle">...</text>
  
  <!-- Signal Reception Module -->
  <rect x="240" y="180" width="140" height="100" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="310" y="215" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Signal Reception</text>
  <text x="310" y="232" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Module</text>
  <text x="310" y="260" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">(120)</text>
  
  <!-- Weight Calculation Module -->
  <rect x="420" y="130" width="140" height="80" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="490" y="160" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Weight Calculation</text>
  <text x="490" y="177" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Module</text>
  <text x="490" y="198" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">(130)</text>
  
  <!-- Affinity Aggregation Module -->
  <rect x="420" y="240" width="140" height="80" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="490" y="268" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Affinity Aggregation</text>
  <text x="490" y="285" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Module</text>
  <text x="490" y="306" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">(140)</text>
  
  <!-- Decision Output Module -->
  <rect x="600" y="180" width="120" height="100" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="660" y="215" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Decision Output</text>
  <text x="660" y="232" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Module</text>
  <text x="660" y="260" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">(150)</text>
  
  <!-- Feedback Module -->
  <rect x="420" y="360" width="140" height="70" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="490" y="390" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Feedback Module</text>
  <text x="490" y="415" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">(160)</text>
  
  <!-- Arrows from Signal Sources to Reception -->
  <line x1="190" y1="150" x2="240" y2="200" stroke="black" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="230" x2="240" y2="230" stroke="black" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="310" x2="240" y2="260" stroke="black" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="390" x2="240" y2="270" stroke="black" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from Reception to Weight -->
  <line x1="380" y1="210" x2="420" y2="170" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from Weight to Affinity -->
  <line x1="490" y1="210" x2="490" y2="240" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from Affinity to Decision -->
  <line x1="560" y1="280" x2="600" y2="250" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from Decision to Feedback -->
  <line x1="660" y1="280" x2="660" y2="395" stroke="black" stroke-width="1"/>
  <line x1="660" y1="395" x2="560" y2="395" stroke="black" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from Feedback to Reception (dashed - feedback loop) -->
  <line x1="420" y1="395" x2="310" y2="395" stroke="black" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="310" y1="395" x2="310" y2="280" stroke="black" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- Labels for data flow -->
  <text x="215" y="195" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">S₁</text>
  <text x="215" y="220" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">S₂</text>
  <text x="215" y="285" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">S₃</text>
  <text x="215" y="355" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Sₙ</text>
  
  <text x="400" y="180" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">signals</text>
  <text x="505" y="228" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">weights</text>
  <text x="590" y="255" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">affinity</text>
  <text x="615" y="350" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">outcome</text>
  <text x="365" y="385" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">quality update</text>
</svg>

