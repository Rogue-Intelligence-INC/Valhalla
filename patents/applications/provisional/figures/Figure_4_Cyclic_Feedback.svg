<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 4 - CYCLIC FEEDBACK MECHANISM (160)</text>
  
  <!-- Time indicator -->
  <text x="50" y="80" font-family="Times New Roman, serif" font-size="12" font-weight="bold">Cycle t:</text>
  <text x="50" y="280" font-family="Times New Roman, serif" font-size="12" font-weight="bold">Cycle t+1:</text>
  
  <!-- Cycle t -->
  <!-- Signal at t -->
  <rect x="100" y="60" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="160" y="85" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Signal(t)</text>
  <text x="160" y="105" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" font-style="italic">quality: q(t)</text>
  
  <!-- Weight at t -->
  <rect x="260" y="60" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="320" y="85" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Weight(t)</text>
  <text x="320" y="105" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" font-style="italic">w = i × q(t)</text>
  
  <!-- Affinity at t -->
  <rect x="420" y="60" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="480" y="85" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Affinity(t)</text>
  <text x="480" y="105" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" font-style="italic">weighted avg</text>
  
  <!-- Decision at t -->
  <rect x="580" y="60" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="640" y="85" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Decision(t)</text>
  <text x="640" y="105" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" font-style="italic">select target</text>
  
  <!-- Arrows cycle t -->
  <line x1="220" y1="90" x2="260" y2="90" stroke="black" stroke-width="1" marker-end="url(#arrow4)"/>
  <line x1="380" y1="90" x2="420" y2="90" stroke="black" stroke-width="1" marker-end="url(#arrow4)"/>
  <line x1="540" y1="90" x2="580" y2="90" stroke="black" stroke-width="1" marker-end="url(#arrow4)"/>
  
  <!-- Feedback arrow (curved) -->
  <path d="M 640 120 L 640 170 L 400 170 L 400 200" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <text x="520" y="165" font-family="Times New Roman, serif" font-size="9">outcome feedback</text>
  
  <!-- Feedback Processing Box -->
  <rect x="300" y="200" width="200" height="70" fill="none" stroke="black" stroke-width="2"/>
  <text x="400" y="225" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">QUALITY UPDATE</text>
  <text x="400" y="245" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">if success: q' = min(q × 1.1, 1.0)</text>
  <text x="400" y="260" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">if failure: q' = max(q × 0.9, 0.0)</text>
  
  <!-- Arrow to next cycle -->
  <line x1="400" y1="270" x2="400" y2="295" stroke="black" stroke-width="1.5" marker-end="url(#arrow4)"/>
  
  <!-- Cycle t+1 -->
  <!-- Signal at t+1 -->
  <rect x="100" y="300" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="160" y="325" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Signal(t+1)</text>
  <text x="160" y="345" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" font-style="italic">quality: q(t+1)</text>
  
  <!-- Weight at t+1 -->
  <rect x="260" y="300" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="320" y="325" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Weight(t+1)</text>
  <text x="320" y="345" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" font-style="italic">w = i × q(t+1)</text>
  
  <!-- Affinity at t+1 -->
  <rect x="420" y="300" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="480" y="325" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Affinity(t+1)</text>
  <text x="480" y="345" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" font-style="italic">updated avg</text>
  
  <!-- Decision at t+1 -->
  <rect x="580" y="300" width="120" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="640" y="325" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Decision(t+1)</text>
  <text x="640" y="345" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" font-style="italic">improved</text>
  
  <!-- Arrows cycle t+1 -->
  <line x1="220" y1="330" x2="260" y2="330" stroke="black" stroke-width="1" marker-end="url(#arrow4)"/>
  <line x1="380" y1="330" x2="420" y2="330" stroke="black" stroke-width="1" marker-end="url(#arrow4)"/>
  <line x1="540" y1="330" x2="580" y2="330" stroke="black" stroke-width="1" marker-end="url(#arrow4)"/>
  
  <!-- Quality flow arrow -->
  <path d="M 400 270 Q 250 285 160 300" fill="none" stroke="black" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow4)"/>
  <text x="280" y="295" font-family="Times New Roman, serif" font-size="8" font-style="italic">q(t+1)</text>
  
  <!-- Continue indicator -->
  <text x="640" y="385" font-family="Times New Roman, serif" font-size="12" text-anchor="middle">↓</text>
  <text x="640" y="405" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" font-style="italic">continues...</text>
  
  <!-- Properties box -->
  <rect x="100" y="420" width="600" height="60" fill="none" stroke="black" stroke-width="1"/>
  <text x="400" y="445" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" font-weight="bold">SELF-IMPROVING BEHAVIOR:</text>
  <text x="400" y="465" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Reliable sources gain influence over time • Unreliable sources dampened automatically</text>
  
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
</svg>

