<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Background -->
  <rect width="800" height="450" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 2 - WEIGHT CALCULATION MODULE (130)</text>
  
  <!-- Main formula box -->
  <rect x="200" y="60" width="400" height="80" fill="none" stroke="black" stroke-width="2"/>
  <text x="400" y="95" font-family="Times New Roman, serif" font-size="18" text-anchor="middle" font-style="italic">weight = intensity × quality_score</text>
  <text x="400" y="125" font-family="Times New Roman, serif" font-size="12" text-anchor="middle">(Equation 1)</text>
  
  <!-- Input Signal Structure -->
  <rect x="50" y="180" width="200" height="180" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="150" y="205" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">INPUT SIGNAL (S)</text>
  <line x1="50" y1="215" x2="250" y2="215" stroke="black" stroke-width="1"/>
  
  <text x="70" y="240" font-family="Times New Roman, serif" font-size="11">source_id: String</text>
  <text x="70" y="265" font-family="Times New Roman, serif" font-size="11">coordinates: [x₁...xₙ]</text>
  <text x="70" y="290" font-family="Times New Roman, serif" font-size="11" font-weight="bold">intensity: f64</text>
  <text x="70" y="315" font-family="Times New Roman, serif" font-size="11" font-weight="bold">quality_score: f64</text>
  <text x="70" y="345" font-family="Times New Roman, serif" font-size="10" font-style="italic">intensity ∈ [0, 1]</text>
  <text x="70" y="358" font-family="Times New Roman, serif" font-size="10" font-style="italic">quality_score ∈ [0, 1]</text>
  
  <!-- Processing Block -->
  <rect x="300" y="220" width="200" height="100" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="400" y="250" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">WEIGHT CALCULATION</text>
  <line x1="300" y1="260" x2="500" y2="260" stroke="black" stroke-width="1"/>
  <text x="400" y="285" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">w = i × q</text>
  <text x="400" y="308" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" font-style="italic">w ∈ [0, 1]</text>
  
  <!-- Output -->
  <rect x="550" y="220" width="200" height="100" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="650" y="250" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">OUTPUT WEIGHT</text>
  <line x1="550" y1="260" x2="750" y2="260" stroke="black" stroke-width="1"/>
  <text x="650" y="285" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">weight: f64</text>
  <text x="650" y="308" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" font-style="italic">bounded [0, 1]</text>
  
  <!-- Arrows -->
  <line x1="250" y1="270" x2="300" y2="270" stroke="black" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="500" y1="270" x2="550" y2="270" stroke="black" stroke-width="1.5" marker-end="url(#arrow2)"/>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- Properties Box -->
  <rect x="150" y="380" width="500" height="55" fill="none" stroke="black" stroke-width="1"/>
  <text x="400" y="400" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" font-weight="bold">MATHEMATICAL PROPERTIES:</text>
  <text x="400" y="420" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">• Multiplicative coupling ensures both factors significant • Zero propagation filters weak signals</text>
  
  <!-- Labels -->
  <text x="275" y="255" font-family="Times New Roman, serif" font-size="9">i, q</text>
  <text x="525" y="255" font-family="Times New Roman, serif" font-size="9">w</text>
</svg>

