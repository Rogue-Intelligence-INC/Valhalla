<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <!-- Background -->
  <rect width="800" height="550" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 3 - AFFINITY AGGREGATION MODULE (140)</text>
  
  <!-- Main formula box -->
  <rect x="150" y="50" width="500" height="70" fill="none" stroke="black" stroke-width="2"/>
  <text x="400" y="80" font-family="Times New Roman, serif" font-size="16" text-anchor="middle" font-style="italic">affinity[i] = Σⱼ(coordinate[i,j] × weight[j]) / Σⱼ(weight[j])</text>
  <text x="400" y="105" font-family="Times New Roman, serif" font-size="12" text-anchor="middle">(Equation 2)</text>
  
  <!-- Input Signals -->
  <text x="100" y="155" font-family="Times New Roman, serif" font-size="12" font-weight="bold">WEIGHTED SIGNALS:</text>
  
  <!-- Signal 1 -->
  <rect x="50" y="170" width="160" height="70" fill="none" stroke="black" stroke-width="1"/>
  <text x="130" y="190" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Signal 1</text>
  <text x="130" y="210" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">coord: (x₁, y₁)</text>
  <text x="130" y="230" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">weight: w₁</text>
  
  <!-- Signal 2 -->
  <rect x="50" y="250" width="160" height="70" fill="none" stroke="black" stroke-width="1"/>
  <text x="130" y="270" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Signal 2</text>
  <text x="130" y="290" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">coord: (x₂, y₂)</text>
  <text x="130" y="310" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">weight: w₂</text>
  
  <!-- Signal N -->
  <rect x="50" y="360" width="160" height="70" fill="none" stroke="black" stroke-width="1"/>
  <text x="130" y="380" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Signal N</text>
  <text x="130" y="400" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">coord: (xₙ, yₙ)</text>
  <text x="130" y="420" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">weight: wₙ</text>
  
  <!-- Dots -->
  <text x="130" y="340" font-family="Times New Roman, serif" font-size="14" text-anchor="middle">⋮</text>
  
  <!-- Aggregation Process -->
  <rect x="280" y="200" width="240" height="200" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="400" y="225" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">AGGREGATION PROCESS</text>
  <line x1="280" y1="235" x2="520" y2="235" stroke="black" stroke-width="1"/>
  
  <text x="300" y="260" font-family="Times New Roman, serif" font-size="10">Step 1: Sum weights</text>
  <text x="310" y="278" font-family="Times New Roman, serif" font-size="10" font-style="italic">W = Σ wⱼ</text>
  
  <text x="300" y="305" font-family="Times New Roman, serif" font-size="10">Step 2: Weighted sum per dim</text>
  <text x="310" y="323" font-family="Times New Roman, serif" font-size="10" font-style="italic">S[i] = Σ (coord[i,j] × wⱼ)</text>
  
  <text x="300" y="350" font-family="Times New Roman, serif" font-size="10">Step 3: Normalize</text>
  <text x="310" y="368" font-family="Times New Roman, serif" font-size="10" font-style="italic">affinity[i] = S[i] / W</text>
  
  <!-- Output Affinity Vector -->
  <rect x="590" y="250" width="160" height="100" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="670" y="280" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">OUTPUT</text>
  <line x1="590" y1="290" x2="750" y2="290" stroke="black" stroke-width="1"/>
  <text x="670" y="315" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Affinity Vector</text>
  <text x="670" y="338" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" font-style="italic">(a₁, a₂, ..., aₙ)</text>
  
  <!-- Arrows -->
  <line x1="210" y1="205" x2="280" y2="250" stroke="black" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="210" y1="285" x2="280" y2="300" stroke="black" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="210" y1="395" x2="280" y2="350" stroke="black" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="520" y1="300" x2="590" y2="300" stroke="black" stroke-width="1.5" marker-end="url(#arrow3)"/>
  
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- Visual representation -->
  <rect x="250" y="440" width="300" height="90" fill="none" stroke="black" stroke-width="1"/>
  <text x="400" y="460" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">GEOMETRIC INTERPRETATION</text>
  <text x="400" y="480" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Affinity = Weighted centroid of signal positions</text>
  <text x="400" y="500" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Higher weight signals pull affinity toward them</text>
  <text x="400" y="520" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" font-style="italic">Result: Unified system preference vector</text>
</svg>

