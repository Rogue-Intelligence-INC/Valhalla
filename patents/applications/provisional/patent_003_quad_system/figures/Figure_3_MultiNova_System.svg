<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 3 - MULTINOVA SYSTEM (310) SIGNAL GENERATION</text>
  
  <!-- Core Formulas -->
  <rect x="100" y="50" width="600" height="80" fill="none" stroke="black" stroke-width="2"/>
  <text x="400" y="75" font-family="Times New Roman, serif" font-size="12" text-anchor="middle" font-style="italic">energy_release = base_energy × compression × fusion × intensity</text>
  <text x="400" y="95" font-family="Times New Roman, serif" font-size="12" text-anchor="middle" font-style="italic">impact_radius = k × (energy_release)^(1/3)</text>
  <text x="400" y="118" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">(Energy Release Computational Formulas)</text>
  
  <!-- Visual representation - expanding circles -->
  <circle cx="200" cy="250" r="20" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="200" cy="250" r="50" fill="none" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="200" cy="250" r="90" fill="none" stroke="black" stroke-width="1" stroke-dasharray="2,4"/>
  
  <text x="200" y="255" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Core</text>
  
  <!-- Radial arrows -->
  <line x1="220" y1="250" x2="280" y2="250" stroke="black" stroke-width="1" marker-end="url(#arrowMN)"/>
  <line x1="200" y1="230" x2="200" y2="165" stroke="black" stroke-width="1" marker-end="url(#arrowMN)"/>
  <line x1="215" y1="265" x2="265" y2="315" stroke="black" stroke-width="1" marker-end="url(#arrowMN)"/>
  <line x1="185" y1="265" x2="135" y2="315" stroke="black" stroke-width="1" marker-end="url(#arrowMN)"/>
  
  <text x="130" y="190" font-family="Times New Roman, serif" font-size="8">wave_front</text>
  
  <!-- Deformation Scales Input -->
  <rect x="350" y="160" width="180" height="120" fill="none" stroke="black" stroke-width="1"/>
  <text x="440" y="185" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">DEFORMATION SCALES</text>
  <line x1="350" y1="195" x2="530" y2="195" stroke="black" stroke-width="1"/>
  <text x="360" y="215" font-family="Times New Roman, serif" font-size="9">intensity: f64</text>
  <text x="360" y="233" font-family="Times New Roman, serif" font-size="9">compression: f64</text>
  <text x="360" y="251" font-family="Times New Roman, serif" font-size="9">fusion: f64</text>
  <text x="360" y="269" font-family="Times New Roman, serif" font-size="9">persistence: f64</text>
  
  <!-- Output signal -->
  <rect x="560" y="160" width="200" height="120" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="660" y="185" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">NOVA EVENT OUTPUT</text>
  <line x1="560" y1="195" x2="760" y2="195" stroke="black" stroke-width="1"/>
  <text x="570" y="215" font-family="Times New Roman, serif" font-size="9">energy_release: f64</text>
  <text x="570" y="233" font-family="Times New Roman, serif" font-size="9">duration: f64</text>
  <text x="570" y="251" font-family="Times New Roman, serif" font-size="9">impact_radius: f64</text>
  <text x="570" y="269" font-family="Times New Roman, serif" font-size="9">wave_front: Vec&lt;f64&gt;</text>
  
  <!-- Arrow from scales to output -->
  <line x1="530" y1="220" x2="560" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#arrowMN)"/>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowMN" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- Use cases -->
  <rect x="350" y="320" width="410" height="100" fill="none" stroke="black" stroke-width="1"/>
  <text x="555" y="345" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">USE CASES</text>
  <line x1="350" y1="355" x2="760" y2="355" stroke="black" stroke-width="1"/>
  <text x="360" y="375" font-family="Times New Roman, serif" font-size="9">• Resource distribution and spreading</text>
  <text x="360" y="393" font-family="Times New Roman, serif" font-size="9">• Workload expansion to multiple nodes</text>
  <text x="360" y="411" font-family="Times New Roman, serif" font-size="9">• Cascade effects and propagation</text>
  
  <!-- Signal characteristics -->
  <rect x="50" y="320" width="250" height="100" fill="none" stroke="black" stroke-width="1"/>
  <text x="175" y="345" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">SIGNAL CHARACTERISTICS</text>
  <line x1="50" y1="355" x2="300" y2="355" stroke="black" stroke-width="1"/>
  <text x="60" y="375" font-family="Times New Roman, serif" font-size="9">• Burst pattern with decay</text>
  <text x="60" y="393" font-family="Times New Roman, serif" font-size="9">• Radial direction vectors</text>
  <text x="60" y="411" font-family="Times New Roman, serif" font-size="9">• Energy-scaled intensity</text>
</svg>

