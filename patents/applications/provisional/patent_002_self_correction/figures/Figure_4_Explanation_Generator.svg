<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <rect width="800" height="550" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 4 - MATHEMATICAL EXPLANATION GENERATOR (240)</text>
  
  <!-- Input -->
  <rect x="50" y="120" width="130" height="80" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="115" y="150" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Correction</text>
  <text x="115" y="168" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Records</text>
  <text x="115" y="190" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">(from 230)</text>
  
  <!-- Generator Module -->
  <rect x="230" y="60" width="340" height="240" fill="none" stroke="black" stroke-width="2"/>
  <text x="400" y="85" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">EXPLANATION GENERATOR (240)</text>
  <line x1="230" y1="95" x2="570" y2="95" stroke="black" stroke-width="1"/>
  
  <!-- Sub-modules -->
  <rect x="250" y="110" width="140" height="55" fill="none" stroke="black" stroke-width="1"/>
  <text x="320" y="133" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">Detection Formula</text>
  <text x="320" y="150" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Builder</text>
  
  <rect x="410" y="110" width="140" height="55" fill="none" stroke="black" stroke-width="1"/>
  <text x="480" y="133" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">Correction Formula</text>
  <text x="480" y="150" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Builder</text>
  
  <rect x="250" y="180" width="140" height="55" fill="none" stroke="black" stroke-width="1"/>
  <text x="320" y="203" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">Derivation Step</text>
  <text x="320" y="220" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Generator</text>
  
  <rect x="410" y="180" width="140" height="55" fill="none" stroke="black" stroke-width="1"/>
  <text x="480" y="203" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">Verification</text>
  <text x="480" y="220" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Condition Builder</text>
  
  <!-- Assembler -->
  <rect x="300" y="250" width="200" height="40" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="400" y="275" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">Explanation Assembler</text>
  
  <!-- Output -->
  <rect x="620" y="100" width="150" height="200" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="695" y="125" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">Mathematical</text>
  <text x="695" y="143" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">Explanation</text>
  <line x1="620" y1="155" x2="770" y2="155" stroke="black" stroke-width="1"/>
  <text x="630" y="175" font-family="Times New Roman, serif" font-size="9">anomaly_description</text>
  <text x="630" y="195" font-family="Times New Roman, serif" font-size="9">detection_formula</text>
  <text x="630" y="215" font-family="Times New Roman, serif" font-size="9">correction_formula</text>
  <text x="630" y="235" font-family="Times New Roman, serif" font-size="9">derivation_steps[]</text>
  <text x="630" y="255" font-family="Times New Roman, serif" font-size="9">verification_conditions[]</text>
  
  <!-- Arrows -->
  <line x1="180" y1="160" x2="230" y2="160" stroke="black" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <line x1="570" y1="200" x2="620" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrow4)"/>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- Example output -->
  <rect x="50" y="330" width="720" height="200" fill="none" stroke="black" stroke-width="1"/>
  <text x="410" y="355" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">EXAMPLE EXPLANATION OUTPUT</text>
  <line x1="50" y1="365" x2="770" y2="365" stroke="black" stroke-width="1"/>
  
  <text x="70" y="390" font-family="Courier New, monospace" font-size="9">ANOMALY: BoundViolation in 'memory_usage' with severity 0.73</text>
  <text x="70" y="410" font-family="Courier New, monospace" font-size="9">DETECTION: memory_usage = 0.92 ∉ [0.0, 0.85]</text>
  <text x="70" y="430" font-family="Courier New, monospace" font-size="9">DERIVATION:</text>
  <text x="90" y="450" font-family="Courier New, monospace" font-size="9">Step 1: Observed value = 0.92</text>
  <text x="90" y="468" font-family="Courier New, monospace" font-size="9">Step 2: Violation = 0.92 - 0.85 = 0.07</text>
  <text x="70" y="488" font-family="Courier New, monospace" font-size="9">CORRECTION: memory_usage' = clamp(0.92, 0.0, 0.85) = 0.85</text>
  <text x="70" y="508" font-family="Courier New, monospace" font-size="9">VERIFICATION: memory_usage' ∈ [0.0, 0.85] ✓</text>
</svg>

