<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 3 - AUTOMATIC CORRECTION MODULE (230)</text>
  
  <!-- Input: Anomalies -->
  <rect x="50" y="150" width="120" height="80" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="110" y="180" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Detected</text>
  <text x="110" y="198" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Anomalies</text>
  <text x="110" y="220" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">(from 220)</text>
  
  <!-- Strategy Selector -->
  <rect x="220" y="100" width="180" height="120" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="310" y="125" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">Strategy Selector</text>
  <line x1="220" y1="135" x2="400" y2="135" stroke="black" stroke-width="1"/>
  <text x="230" y="155" font-family="Times New Roman, serif" font-size="9">Match anomaly_type</text>
  <text x="230" y="170" font-family="Times New Roman, serif" font-size="9">Check severity_range</text>
  <text x="230" y="185" font-family="Times New Roman, serif" font-size="9">Select strategy</text>
  <text x="230" y="210" font-family="Times New Roman, serif" font-size="8" font-style="italic">strategy = match(anomaly)</text>
  
  <!-- Strategy Library -->
  <rect x="220" y="250" width="180" height="150" fill="none" stroke="black" stroke-width="1"/>
  <text x="310" y="275" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">Strategy Library</text>
  <line x1="220" y1="285" x2="400" y2="285" stroke="black" stroke-width="1"/>
  <text x="230" y="305" font-family="Times New Roman, serif" font-size="9">• Additive: v' = v + δ</text>
  <text x="230" y="325" font-family="Times New Roman, serif" font-size="9">• Multiplicative: v' = v × f</text>
  <text x="230" y="345" font-family="Times New Roman, serif" font-size="9">• Clamping: v' = clamp(v)</text>
  <text x="230" y="365" font-family="Times New Roman, serif" font-size="9">• Reset: v' = default</text>
  <text x="230" y="385" font-family="Times New Roman, serif" font-size="9">• Smoothing: v' = αv + (1-α)t</text>
  
  <!-- Correction Generator -->
  <rect x="450" y="130" width="150" height="100" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="525" y="158" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">Correction</text>
  <text x="525" y="175" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">Generator</text>
  <line x1="450" y1="185" x2="600" y2="185" stroke="black" stroke-width="1"/>
  <text x="525" y="205" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Create correction</text>
  <text x="525" y="220" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">with formula</text>
  
  <!-- Application Engine -->
  <rect x="450" y="270" width="150" height="80" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="525" y="298" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">Application</text>
  <text x="525" y="315" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">Engine</text>
  <text x="525" y="340" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">state' = apply(state, c)</text>
  
  <!-- Output -->
  <rect x="650" y="180" width="120" height="100" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="710" y="210" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Correction</text>
  <text x="710" y="228" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Records</text>
  <line x1="650" y1="240" x2="770" y2="240" stroke="black" stroke-width="1"/>
  <text x="660" y="258" font-family="Times New Roman, serif" font-size="8">old_value</text>
  <text x="660" y="272" font-family="Times New Roman, serif" font-size="8">new_value</text>
  
  <!-- Arrows -->
  <line x1="170" y1="190" x2="220" y2="160" stroke="black" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="310" y1="250" x2="310" y2="220" stroke="black" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="400" y1="160" x2="450" y2="175" stroke="black" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="525" y1="230" x2="525" y2="270" stroke="black" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="600" y1="310" x2="650" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#arrow3)"/>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- To Explanation Generator -->
  <rect x="650" y="320" width="120" height="50" fill="none" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="710" y="345" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">→ Explanation</text>
  <text x="710" y="360" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Generator (240)</text>
  
  <line x1="710" y1="280" x2="710" y2="320" stroke="black" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow3)"/>
</svg>

