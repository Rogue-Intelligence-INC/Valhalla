<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 2 - ANOMALY DETECTION MODULE (220)</text>
  
  <!-- Input -->
  <rect x="50" y="180" width="120" height="80" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="110" y="210" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Dimensional</text>
  <text x="110" y="228" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">State</text>
  <text x="110" y="250" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" font-style="italic">(n dimensions)</text>
  
  <!-- Main detection module -->
  <rect x="220" y="80" width="360" height="320" fill="none" stroke="black" stroke-width="2"/>
  <text x="400" y="105" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">ANOMALY DETECTION MODULE (220)</text>
  <line x1="220" y1="115" x2="580" y2="115" stroke="black" stroke-width="1"/>
  
  <!-- Method A -->
  <rect x="240" y="130" width="150" height="70" fill="none" stroke="black" stroke-width="1"/>
  <text x="315" y="155" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">Method A</text>
  <text x="315" y="172" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Bound Violation</text>
  <text x="315" y="188" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" font-style="italic">v ∉ [min, max]</text>
  
  <!-- Method B -->
  <rect x="410" y="130" width="150" height="70" fill="none" stroke="black" stroke-width="1"/>
  <text x="485" y="155" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">Method B</text>
  <text x="485" y="172" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Trend Divergence</text>
  <text x="485" y="188" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" font-style="italic">Δtrend > θ</text>
  
  <!-- Method C -->
  <rect x="325" y="220" width="150" height="70" fill="none" stroke="black" stroke-width="1"/>
  <text x="400" y="245" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">Method C</text>
  <text x="400" y="262" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Pattern Anomaly</text>
  <text x="400" y="278" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" font-style="italic">dist(P, P_known) > θ</text>
  
  <!-- Aggregator -->
  <rect x="300" y="310" width="200" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="400" y="335" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">Anomaly Aggregator</text>
  <text x="400" y="355" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Collect + Prioritize</text>
  
  <!-- Output -->
  <rect x="630" y="180" width="120" height="80" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="690" y="210" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Detected</text>
  <text x="690" y="228" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Anomalies</text>
  <text x="690" y="250" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" font-style="italic">(with severity)</text>
  
  <!-- Arrows -->
  <line x1="170" y1="220" x2="220" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#arrow2)"/>
  
  <line x1="315" y1="200" x2="315" y2="240" stroke="black" stroke-width="1"/>
  <line x1="315" y1="240" x2="325" y2="255" stroke="black" stroke-width="1" marker-end="url(#arrow2)"/>
  
  <line x1="485" y1="200" x2="485" y2="240" stroke="black" stroke-width="1"/>
  <line x1="485" y1="240" x2="475" y2="255" stroke="black" stroke-width="1" marker-end="url(#arrow2)"/>
  
  <line x1="400" y1="290" x2="400" y2="310" stroke="black" stroke-width="1" marker-end="url(#arrow2)"/>
  
  <line x1="500" y1="340" x2="580" y2="340" stroke="black" stroke-width="1"/>
  <line x1="580" y1="340" x2="580" y2="220" stroke="black" stroke-width="1"/>
  <line x1="580" y1="220" x2="630" y2="220" stroke="black" stroke-width="1.5" marker-end="url(#arrow2)"/>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- Anomaly structure -->
  <rect x="50" y="380" width="300" height="100" fill="none" stroke="black" stroke-width="1"/>
  <text x="200" y="400" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">ANOMALY DATA STRUCTURE</text>
  <text x="60" y="420" font-family="Times New Roman, serif" font-size="9">anomaly_type: BoundViolation | TrendDivergence | ...</text>
  <text x="60" y="438" font-family="Times New Roman, serif" font-size="9">dimension_id: String</text>
  <text x="60" y="456" font-family="Times New Roman, serif" font-size="9">severity: f64 [0.0, 1.0]</text>
  <text x="60" y="474" font-family="Times New Roman, serif" font-size="9">detected_value: f64, expected_range: (f64, f64)</text>
</svg>

