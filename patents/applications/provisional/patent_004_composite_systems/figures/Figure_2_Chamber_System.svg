<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 2 - CHAMBER SYSTEM (400) HIERARCHICAL COMPOSITION</text>
  
  <!-- Hierarchy visualization -->
  <text x="100" y="70" font-family="Times New Roman, serif" font-size="12" font-weight="bold">Composition: Chamber ← Space ← Voyager ← Fate</text>
  
  <!-- Chamber -->
  <rect x="50" y="100" width="700" height="300" fill="none" stroke="black" stroke-width="2"/>
  <text x="400" y="125" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle">CHAMBER ORCHESTRATOR (400)</text>
  <line x1="50" y1="135" x2="750" y2="135" stroke="black" stroke-width="1"/>
  
  <!-- Space Manager -->
  <rect x="80" y="155" width="200" height="100" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="180" y="180" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">Space Manager</text>
  <text x="180" y="200" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Dimensional Space</text>
  <text x="180" y="215" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Management</text>
  <text x="180" y="240" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" font-style="italic">allocate_resources()</text>
  
  <!-- Voyager Analyzer -->
  <rect x="300" y="155" width="200" height="100" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="400" y="180" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">Voyager Analyzer</text>
  <text x="400" y="200" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">High-Dimensional</text>
  <text x="400" y="215" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Analysis</text>
  <text x="400" y="240" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" font-style="italic">detect_unknown_behaviors()</text>
  
  <!-- Fate Coordinator -->
  <rect x="520" y="155" width="200" height="100" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="620" y="180" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">Fate Coordinator</text>
  <text x="620" y="200" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Unified Signal</text>
  <text x="620" y="215" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Coordination</text>
  <text x="620" y="240" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" font-style="italic">coordinate()</text>
  
  <!-- Arrows between components -->
  <line x1="280" y1="205" x2="300" y2="205" stroke="black" stroke-width="1" marker-end="url(#arrowCH)"/>
  <line x1="500" y1="205" x2="520" y2="205" stroke="black" stroke-width="1" marker-end="url(#arrowCH)"/>
  
  <!-- Orchestration Types -->
  <rect x="80" y="280" width="300" height="100" fill="none" stroke="black" stroke-width="1"/>
  <text x="230" y="305" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">ORCHESTRATION TYPES</text>
  <line x1="80" y1="315" x2="380" y2="315" stroke="black" stroke-width="1"/>
  <text x="95" y="335" font-family="Times New Roman, serif" font-size="9">• QuadSystemCoordination: Full 4-system</text>
  <text x="95" y="352" font-family="Times New Roman, serif" font-size="9">• MathematicalEnhanced: Optimization focus</text>
  <text x="95" y="369" font-family="Times New Roman, serif" font-size="9">• AdaptiveDimensional: Dynamic adjustment</text>
  
  <!-- Container output -->
  <rect x="420" y="280" width="300" height="100" fill="none" stroke="black" stroke-width="1"/>
  <text x="570" y="305" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">CONTAINER OUTPUT</text>
  <line x1="420" y1="315" x2="720" y2="315" stroke="black" stroke-width="1"/>
  <text x="435" y="335" font-family="Times New Roman, serif" font-size="9">Container {</text>
  <text x="445" y="352" font-family="Times New Roman, serif" font-size="9">workload, resource_allocation,</text>
  <text x="445" y="369" font-family="Times New Roman, serif" font-size="9">dimensional_position: Vec&lt;f64&gt;</text>
  <text x="435" y="380" font-family="Times New Roman, serif" font-size="9">}</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowCH" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
</svg>

