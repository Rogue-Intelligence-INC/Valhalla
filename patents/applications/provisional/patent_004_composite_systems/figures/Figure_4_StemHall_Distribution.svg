<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 4 - STEMHALL-NA (420) WORKLOAD DISTRIBUTION</text>
  
  <!-- Input -->
  <rect x="50" y="60" width="120" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="110" y="90" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Workload</text>
  
  <!-- StemHall-NA Main -->
  <rect x="220" y="50" width="360" height="120" fill="none" stroke="black" stroke-width="2"/>
  <text x="400" y="75" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">STEMHALL-NA (420)</text>
  <line x1="220" y1="85" x2="580" y2="85" stroke="black" stroke-width="1"/>
  
  <!-- Metrics Collector -->
  <rect x="240" y="100" width="140" height="50" fill="none" stroke="black" stroke-width="1"/>
  <text x="310" y="125" font-family="Times New Roman, serif" font-size="9" font-weight="bold" text-anchor="middle">Metrics Collector</text>
  <text x="310" y="142" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">speed, reliability, health</text>
  
  <!-- Score Calculator -->
  <rect x="400" y="100" width="160" height="50" fill="none" stroke="black" stroke-width="1"/>
  <text x="480" y="120" font-family="Times New Roman, serif" font-size="9" font-weight="bold" text-anchor="middle">Score Calculator</text>
  <text x="480" y="140" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" font-style="italic">score = s × r × h</text>
  
  <!-- Arrow from metrics to score -->
  <line x1="380" y1="125" x2="400" y2="125" stroke="black" stroke-width="1" marker-end="url(#arrowSH)"/>
  
  <!-- Arrow from input to StemHall -->
  <line x1="170" y1="85" x2="220" y2="85" stroke="black" stroke-width="1.5" marker-end="url(#arrowSH)"/>
  
  <!-- Decision Diamond -->
  <polygon points="400,200 480,250 400,300 320,250" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="400" y="245" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Compare</text>
  <text x="400" y="260" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Scores</text>
  
  <!-- Arrow from StemHall to Diamond -->
  <line x1="400" y1="170" x2="400" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrowSH)"/>
  
  <!-- Three output paths -->
  <!-- Chamber path -->
  <rect x="100" y="350" width="150" height="80" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="175" y="380" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">CHAMBER (400)</text>
  <text x="175" y="400" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Container</text>
  <text x="175" y="415" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Orchestration</text>
  
  <!-- Balanced path -->
  <rect x="325" y="350" width="150" height="80" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="400" y="380" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">BALANCED</text>
  <text x="400" y="400" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Split by ratio</text>
  <text x="400" y="415" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">c_r / (c_r + s_r)</text>
  
  <!-- StemCell path -->
  <rect x="550" y="350" width="150" height="80" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="625" y="380" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle">STEMCELL (410)</text>
  <text x="625" y="400" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Cellular</text>
  <text x="625" y="415" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Network</text>
  
  <!-- Arrows from diamond to outputs -->
  <line x1="320" y1="250" x2="175" y2="250" stroke="black" stroke-width="1"/>
  <line x1="175" y1="250" x2="175" y2="350" stroke="black" stroke-width="1.5" marker-end="url(#arrowSH)"/>
  <text x="230" y="240" font-family="Times New Roman, serif" font-size="8">ratio > 1.5</text>
  
  <line x1="400" y1="300" x2="400" y2="350" stroke="black" stroke-width="1.5" marker-end="url(#arrowSH)"/>
  <text x="420" y="320" font-family="Times New Roman, serif" font-size="8">0.67 ≤ r ≤ 1.5</text>
  
  <line x1="480" y1="250" x2="625" y2="250" stroke="black" stroke-width="1"/>
  <line x1="625" y1="250" x2="625" y2="350" stroke="black" stroke-width="1.5" marker-end="url(#arrowSH)"/>
  <text x="540" y="240" font-family="Times New Roman, serif" font-size="8">ratio &lt; 0.67</text>
  
  <!-- Metrics collection arrows -->
  <line x1="175" y1="430" x2="175" y2="460" stroke="black" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="175" y1="460" x2="310" y2="460" stroke="black" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="310" y1="460" x2="310" y2="150" stroke="black" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowSH)"/>
  
  <line x1="625" y1="430" x2="625" y2="470" stroke="black" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="625" y1="470" x2="320" y2="470" stroke="black" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="320" y1="470" x2="320" y2="150" stroke="black" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowSH)"/>
  
  <text x="250" y="448" font-family="Times New Roman, serif" font-size="7">metrics feedback</text>
  <text x="470" y="458" font-family="Times New Roman, serif" font-size="7">metrics feedback</text>
  
  <!-- Score formula box -->
  <rect x="630" y="60" width="150" height="100" fill="none" stroke="black" stroke-width="1"/>
  <text x="705" y="80" font-family="Times New Roman, serif" font-size="9" font-weight="bold" text-anchor="middle">SCORE FORMULA</text>
  <line x1="630" y1="90" x2="780" y2="90" stroke="black" stroke-width="1"/>
  <text x="705" y="110" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" font-style="italic">score = speed ×</text>
  <text x="705" y="125" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" font-style="italic">reliability ×</text>
  <text x="705" y="140" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" font-style="italic">health</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowSH" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
</svg>

