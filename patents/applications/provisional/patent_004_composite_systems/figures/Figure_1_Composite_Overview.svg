<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <rect width="800" height="550" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 1 - COMPOSITE SYSTEM ARCHITECTURE OVERVIEW</text>
  
  <!-- StemHall-NA Layer -->
  <rect x="100" y="60" width="600" height="80" fill="none" stroke="black" stroke-width="2"/>
  <text x="400" y="90" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle">STEMHALL-NA (420)</text>
  <text x="400" y="115" font-family="Times New Roman, serif" font-size="11" text-anchor="middle">Intelligent Workload Distribution</text>
  <text x="400" y="132" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" font-style="italic">score = speed × reliability × health</text>
  
  <!-- Routing arrows -->
  <line x1="280" y1="140" x2="220" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrowCS)"/>
  <line x1="520" y1="140" x2="580" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrowCS)"/>
  <text x="230" y="175" font-family="Times New Roman, serif" font-size="9">route</text>
  <text x="550" y="175" font-family="Times New Roman, serif" font-size="9">route</text>
  
  <!-- Chamber System -->
  <rect x="100" y="200" width="280" height="200" fill="none" stroke="black" stroke-width="2"/>
  <text x="240" y="230" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle">CHAMBER (400)</text>
  <text x="240" y="250" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Container Orchestration</text>
  <line x1="100" y1="260" x2="380" y2="260" stroke="black" stroke-width="1"/>
  
  <!-- Chamber hierarchy -->
  <rect x="120" y="275" width="100" height="35" fill="none" stroke="black" stroke-width="1"/>
  <text x="170" y="298" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Space Manager</text>
  
  <rect x="120" y="320" width="100" height="35" fill="none" stroke="black" stroke-width="1"/>
  <text x="170" y="343" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Voyager Analyzer</text>
  
  <rect x="120" y="365" width="100" height="30" fill="none" stroke="black" stroke-width="1"/>
  <text x="170" y="385" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">Fate Coordinator</text>
  
  <!-- Chamber arrows -->
  <line x1="170" y1="310" x2="170" y2="320" stroke="black" stroke-width="1" marker-end="url(#arrowCS)"/>
  <line x1="170" y1="355" x2="170" y2="365" stroke="black" stroke-width="1" marker-end="url(#arrowCS)"/>
  
  <!-- Chamber types -->
  <text x="300" y="290" font-family="Times New Roman, serif" font-size="8">Types:</text>
  <text x="300" y="305" font-family="Times New Roman, serif" font-size="8">• QuadSystem</text>
  <text x="300" y="320" font-family="Times New Roman, serif" font-size="8">• Mathematical</text>
  <text x="300" y="335" font-family="Times New Roman, serif" font-size="8">• Adaptive</text>
  <text x="300" y="350" font-family="Times New Roman, serif" font-size="8">• Hybrid</text>
  
  <!-- StemCell System -->
  <rect x="420" y="200" width="280" height="200" fill="none" stroke="black" stroke-width="2"/>
  <text x="560" y="230" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle">STEMCELL (410)</text>
  <text x="560" y="250" font-family="Times New Roman, serif" font-size="10" text-anchor="middle">Bio-Inspired Cellular Network</text>
  <line x1="420" y1="260" x2="700" y2="260" stroke="black" stroke-width="1"/>
  
  <!-- Cell grid -->
  <rect x="440" y="275" width="40" height="40" fill="none" stroke="black" stroke-width="1"/>
  <text x="460" y="300" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Cell</text>
  
  <rect x="490" y="275" width="40" height="40" fill="none" stroke="black" stroke-width="1"/>
  <text x="510" y="300" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Cell</text>
  
  <rect x="540" y="275" width="40" height="40" fill="none" stroke="black" stroke-width="1"/>
  <text x="560" y="300" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Cell</text>
  
  <rect x="440" y="325" width="40" height="40" fill="none" stroke="black" stroke-width="1"/>
  <text x="460" y="350" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Cell</text>
  
  <rect x="490" y="325" width="40" height="40" fill="none" stroke="black" stroke-width="1"/>
  <text x="510" y="350" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Cell</text>
  
  <rect x="540" y="325" width="40" height="40" fill="none" stroke="black" stroke-width="1"/>
  <text x="560" y="350" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Cell</text>
  
  <!-- Cell components -->
  <text x="620" y="290" font-family="Times New Roman, serif" font-size="8">Each cell:</text>
  <text x="620" y="305" font-family="Times New Roman, serif" font-size="8">• MinimalFate</text>
  <text x="620" y="320" font-family="Times New Roman, serif" font-size="8">• Local Systems</text>
  <text x="620" y="335" font-family="Times New Roman, serif" font-size="8">• BasePosition</text>
  
  <!-- InterCellular Fate -->
  <rect x="440" y="375" width="180" height="20" fill="none" stroke="black" stroke-width="1"/>
  <text x="530" y="390" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">InterCellular Fate</text>
  
  <!-- Core Integration -->
  <rect x="150" y="430" width="500" height="100" fill="none" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="455" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">CORE INTEGRATION</text>
  <line x1="150" y1="465" x2="650" y2="465" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="485" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">VALHALLA-PROV-001: weight = intensity × quality_score</text>
  <text x="400" y="502" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">VALHALLA-PROV-002: Self-Correcting Cyclic Processing</text>
  <text x="400" y="519" font-family="Times New Roman, serif" font-size="9" text-anchor="middle">VALHALLA-PROV-003: Physics-Inspired Signal Generation</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowCS" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
</svg>

