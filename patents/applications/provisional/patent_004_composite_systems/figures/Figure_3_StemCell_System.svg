<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">FIG. 3 - STEMCELL SYSTEM (410) BIO-INSPIRED ARCHITECTURE</text>
  
  <!-- Single Cell Detail -->
  <rect x="50" y="60" width="350" height="220" fill="none" stroke="black" stroke-width="2"/>
  <text x="225" y="85" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">SINGLE CELL STRUCTURE</text>
  <line x1="50" y1="95" x2="400" y2="95" stroke="black" stroke-width="1"/>
  
  <!-- Cell components -->
  <rect x="70" y="110" width="130" height="50" fill="none" stroke="black" stroke-width="1"/>
  <text x="135" y="135" font-family="Times New Roman, serif" font-size="9" font-weight="bold" text-anchor="middle">MinimalFate</text>
  <text x="135" y="150" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">w = i × q</text>
  
  <rect x="220" y="110" width="160" height="50" fill="none" stroke="black" stroke-width="1"/>
  <text x="300" y="130" font-family="Times New Roman, serif" font-size="9" font-weight="bold" text-anchor="middle">LocalSubsystems</text>
  <text x="300" y="150" font-family="Times New Roman, serif" font-size="7" text-anchor="middle">BH | Nova | MB | BF</text>
  
  <!-- BasePosition -->
  <rect x="70" y="175" width="310" height="45" fill="none" stroke="black" stroke-width="1"/>
  <text x="225" y="195" font-family="Times New Roman, serif" font-size="9" font-weight="bold" text-anchor="middle">BasePosition</text>
  <text x="225" y="212" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">Structure | Transform | Relation | Explore</text>
  
  <!-- Update cycle -->
  <rect x="70" y="235" width="310" height="35" fill="none" stroke="black" stroke-width="1"/>
  <text x="225" y="258" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">update(): signals → fate → preference → state</text>
  
  <!-- Population View -->
  <rect x="430" y="60" width="350" height="220" fill="none" stroke="black" stroke-width="2"/>
  <text x="605" y="85" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">CELL POPULATION (410)</text>
  <line x1="430" y1="95" x2="780" y2="95" stroke="black" stroke-width="1"/>
  
  <!-- Cell grid -->
  <g transform="translate(450, 110)">
    <rect x="0" y="0" width="50" height="50" fill="none" stroke="black" stroke-width="1"/>
    <rect x="60" y="0" width="50" height="50" fill="none" stroke="black" stroke-width="1"/>
    <rect x="120" y="0" width="50" height="50" fill="none" stroke="black" stroke-width="1"/>
    <rect x="0" y="60" width="50" height="50" fill="none" stroke="black" stroke-width="1"/>
    <rect x="60" y="60" width="50" height="50" fill="none" stroke="black" stroke-width="1"/>
    <rect x="120" y="60" width="50" height="50" fill="none" stroke="black" stroke-width="1"/>
    
    <!-- Cell labels -->
    <text x="25" y="30" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">C1</text>
    <text x="85" y="30" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">C2</text>
    <text x="145" y="30" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">C3</text>
    <text x="25" y="90" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">C4</text>
    <text x="85" y="90" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">C5</text>
    <text x="145" y="90" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">C6</text>
    
    <!-- Intercellular connections -->
    <line x1="50" y1="25" x2="60" y2="25" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="110" y1="25" x2="120" y2="25" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="25" y1="50" x2="25" y2="60" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="85" y1="50" x2="85" y2="60" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="145" y1="50" x2="145" y2="60" stroke="black" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>
  
  <!-- InterCellular Fate -->
  <rect x="660" y="120" width="100" height="80" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="710" y="145" font-family="Times New Roman, serif" font-size="9" font-weight="bold" text-anchor="middle">InterCellular</text>
  <text x="710" y="160" font-family="Times New Roman, serif" font-size="9" font-weight="bold" text-anchor="middle">Fate</text>
  <text x="710" y="185" font-family="Times New Roman, serif" font-size="7" text-anchor="middle">global_affinity</text>
  
  <!-- Arrow from cells to intercellular -->
  <line x1="625" y1="160" x2="660" y2="160" stroke="black" stroke-width="1" marker-end="url(#arrowSC)"/>
  
  <!-- Population step -->
  <rect x="450" y="235" width="310" height="35" fill="none" stroke="black" stroke-width="1"/>
  <text x="605" y="258" font-family="Times New Roman, serif" font-size="8" text-anchor="middle">step(): cells_update → intercellular → influence</text>
  
  <!-- Formula Section -->
  <rect x="50" y="310" width="350" height="160" fill="none" stroke="black" stroke-width="1"/>
  <text x="225" y="335" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">MINIMAL FATE FORMULA</text>
  <line x1="50" y1="345" x2="400" y2="345" stroke="black" stroke-width="1"/>
  
  <text x="70" y="370" font-family="Times New Roman, serif" font-size="10">For each signal in buffer:</text>
  <text x="90" y="390" font-family="Times New Roman, serif" font-size="10" font-style="italic">weight = intensity × quality_score</text>
  <text x="70" y="415" font-family="Times New Roman, serif" font-size="10">Internal preference:</text>
  <text x="90" y="435" font-family="Times New Roman, serif" font-size="10" font-style="italic">pref[i] = Σ(dir[i] × weight) / Σ(weight)</text>
  <text x="70" y="460" font-family="Times New Roman, serif" font-size="9" font-style="italic">Same as VALHALLA-PROV-001</text>
  
  <!-- BasePosition mapping -->
  <rect x="430" y="310" width="350" height="160" fill="none" stroke="black" stroke-width="1"/>
  <text x="605" y="335" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle">BASE POSITION MAPPING</text>
  <line x1="430" y1="345" x2="780" y2="345" stroke="black" stroke-width="1"/>
  
  <text x="450" y="370" font-family="Times New Roman, serif" font-size="9">Structure  → BlackHole   (consolidation)</text>
  <text x="450" y="390" font-family="Times New Roman, serif" font-size="9">Transform  → MultiNova   (expansion)</text>
  <text x="450" y="410" font-family="Times New Roman, serif" font-size="9">Relation   → MeshBrain   (connectivity)</text>
  <text x="450" y="430" font-family="Times New Roman, serif" font-size="9">Explore    → BaseForce   (foundation)</text>
  <text x="450" y="460" font-family="Times New Roman, serif" font-size="9" font-style="italic">Maps to VALHALLA-PROV-003 systems</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowSC" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
</svg>

