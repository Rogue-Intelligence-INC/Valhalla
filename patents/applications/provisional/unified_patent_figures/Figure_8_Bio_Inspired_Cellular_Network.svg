<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>FIG. 8 - Bio-Inspired Cellular Network Architecture</title>
  
  <!-- Background -->
  <rect width="800" height="600" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">FIG. 8 - Bio-Inspired Cellular Network Architecture</text>
  
  <!-- Cell Network Visualization -->
  <rect x="50" y="50" width="350" height="300" fill="none" stroke="black" stroke-width="2"/>
  <text x="225" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">CELLULAR NETWORK</text>
  
  <!-- Structure Position Cells (mapped to System A) -->
  <circle cx="120" cy="130" r="25" fill="none" stroke="black" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold">Structure</text>
  <text x="120" y="138" text-anchor="middle" font-family="Arial" font-size="7">Sys A</text>
  
  <circle cx="200" cy="180" r="25" fill="none" stroke="black" stroke-width="2"/>
  <text x="200" y="175" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold">Structure</text>
  <text x="200" y="188" text-anchor="middle" font-family="Arial" font-size="7">Sys A</text>
  
  <!-- Transform Position Cells (mapped to System C) -->
  <circle cx="280" cy="120" r="25" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="280" y="115" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold">Transform</text>
  <text x="280" y="128" text-anchor="middle" font-family="Arial" font-size="7">Sys C</text>
  
  <circle cx="340" cy="200" r="25" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="340" y="195" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold">Transform</text>
  <text x="340" y="208" text-anchor="middle" font-family="Arial" font-size="7">Sys C</text>
  
  <!-- Relation Position Cells (mapped to System B) -->
  <circle cx="150" cy="250" r="25" fill="none" stroke="black" stroke-width="1"/>
  <text x="150" y="245" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold">Relation</text>
  <text x="150" y="258" text-anchor="middle" font-family="Arial" font-size="7">Sys B</text>
  
  <circle cx="250" cy="280" r="25" fill="none" stroke="black" stroke-width="1"/>
  <text x="250" y="275" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold">Relation</text>
  <text x="250" y="288" text-anchor="middle" font-family="Arial" font-size="7">Sys B</text>
  
  <!-- Explore Position Cell (Mixed) -->
  <circle cx="320" cy="310" r="25" fill="none" stroke="black" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="320" y="305" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold">Explore</text>
  <text x="320" y="318" text-anchor="middle" font-family="Arial" font-size="7">Mixed</text>
  
  <!-- Connections between cells -->
  <line x1="145" y1="130" x2="175" y2="160" stroke="black" stroke-width="1"/>
  <line x1="225" y1="175" x2="255" y2="130" stroke="black" stroke-width="1"/>
  <line x1="220" y1="200" x2="255" y2="270" stroke="black" stroke-width="1"/>
  <line x1="305" y1="140" x2="320" y2="180" stroke="black" stroke-width="1"/>
  <line x1="175" y1="255" x2="225" y2="275" stroke="black" stroke-width="1"/>
  <line x1="275" y1="285" x2="295" y2="300" stroke="black" stroke-width="1"/>
  <line x1="340" y1="225" x2="330" y2="285" stroke="black" stroke-width="1"/>
  
  <!-- Position Types Legend -->
  <rect x="430" y="50" width="320" height="150" fill="none" stroke="black" stroke-width="1"/>
  <text x="590" y="75" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">POSITION TYPES</text>
  
  <!-- Structure -->
  <circle cx="455" cy="100" r="12" fill="none" stroke="black" stroke-width="2"/>
  <text x="550" y="97" font-family="Arial" font-size="9" font-weight="bold">Structure</text>
  <text x="550" y="110" font-family="Arial" font-size="8">→ System A (Aggregation)</text>
  <text x="660" y="103" font-family="Arial" font-size="8">Stability, Compression</text>
  
  <!-- Transform -->
  <circle cx="455" cy="130" r="12" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="550" y="127" font-family="Arial" font-size="9" font-weight="bold">Transform</text>
  <text x="550" y="140" font-family="Arial" font-size="8">→ System C (Parallel)</text>
  <text x="660" y="133" font-family="Arial" font-size="8">Mutation, Innovation</text>
  
  <!-- Relation -->
  <circle cx="455" cy="160" r="12" fill="none" stroke="black" stroke-width="1"/>
  <text x="550" y="157" font-family="Arial" font-size="9" font-weight="bold">Relation</text>
  <text x="550" y="170" font-family="Arial" font-size="8">→ System B (Network)</text>
  <text x="660" y="163" font-family="Arial" font-size="8">Connectivity, Memory</text>
  
  <!-- Explore -->
  <circle cx="455" cy="190" r="12" fill="none" stroke="black" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="550" y="187" font-family="Arial" font-size="9" font-weight="bold">Explore</text>
  <text x="550" y="200" font-family="Arial" font-size="8">→ Mixed Systems</text>
  <text x="660" y="193" font-family="Arial" font-size="8">Curiosity, Risk</text>
  
  <!-- Coordination Engine Connection -->
  <rect x="430" y="220" width="320" height="130" fill="none" stroke="black" stroke-width="2"/>
  <text x="590" y="245" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">COORDINATION ENGINE</text>
  <text x="590" y="265" text-anchor="middle" font-family="Arial" font-size="10">(Guides Network Evolution)</text>
  
  <text x="450" y="290" font-family="Arial" font-size="9">• Receive cell state signals</text>
  <text x="450" y="305" font-family="Arial" font-size="9">• Compute network affinities</text>
  <text x="450" y="320" font-family="Arial" font-size="9">• Guide cell evolution decisions</text>
  <text x="450" y="335" font-family="Arial" font-size="9">• Balance position distribution</text>
  
  <!-- Arrow from network to engine -->
  <line x1="400" y1="200" x2="425" y2="250" stroke="black" stroke-width="1.5"/>
  <polygon points="425,250 418,242 427,240" fill="black"/>
  
  <!-- Evolution Process -->
  <rect x="50" y="370" width="700" height="100" fill="none" stroke="black" stroke-width="1"/>
  <text x="400" y="395" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">CELL EVOLUTION PROCESS</text>
  
  <rect x="80" y="410" width="130" height="45" fill="none" stroke="black" stroke-width="1"/>
  <text x="145" y="430" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">Low Performance</text>
  <text x="145" y="445" text-anchor="middle" font-family="Arial" font-size="8">→ Position Shift</text>
  
  <rect x="230" y="410" width="130" height="45" fill="none" stroke="black" stroke-width="1"/>
  <text x="295" y="430" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">High Strength</text>
  <text x="295" y="445" text-anchor="middle" font-family="Arial" font-size="8">→ Develop Specialization</text>
  
  <rect x="380" y="410" width="130" height="45" fill="none" stroke="black" stroke-width="1"/>
  <text x="445" y="430" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">Good Performance</text>
  <text x="445" y="445" text-anchor="middle" font-family="Arial" font-size="8">→ Enhance Capabilities</text>
  
  <rect x="530" y="410" width="130" height="45" fill="none" stroke="black" stroke-width="1"/>
  <text x="595" y="430" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold">Stable</text>
  <text x="595" y="445" text-anchor="middle" font-family="Arial" font-size="8">→ Maintain</text>
  
  <!-- Arrows between evolution stages -->
  <line x1="210" y1="432" x2="225" y2="432" stroke="black" stroke-width="1"/>
  <line x1="360" y1="432" x2="375" y2="432" stroke="black" stroke-width="1"/>
  <line x1="510" y1="432" x2="525" y2="432" stroke="black" stroke-width="1"/>
  
  <!-- Network Characteristics -->
  <rect x="50" y="490" width="700" height="90" fill="none" stroke="black" stroke-width="1"/>
  <text x="400" y="515" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">NETWORK CHARACTERISTICS</text>
  <text x="150" y="540" text-anchor="middle" font-family="Arial" font-size="9">• Position-based connections</text>
  <text x="150" y="555" text-anchor="middle" font-family="Arial" font-size="9">• Type compatibility scoring</text>
  <text x="400" y="540" text-anchor="middle" font-family="Arial" font-size="9">• Coordination-guided evolution</text>
  <text x="400" y="555" text-anchor="middle" font-family="Arial" font-size="9">• Dynamic topology adaptation</text>
  <text x="650" y="540" text-anchor="middle" font-family="Arial" font-size="9">• Self-organizing behavior</text>
  <text x="650" y="555" text-anchor="middle" font-family="Arial" font-size="9">• Emergent specialization</text>
</svg>

