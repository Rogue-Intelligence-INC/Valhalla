<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650">
  <title>Figure 7 - Mathematical Explanation Generation Workflow</title>
  
  <!-- Background -->
  <rect width="800" height="650" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">
    FIG. 7 - MATHEMATICAL EXPLANATION GENERATION WORKFLOW
  </text>
  
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
  
  <!-- Input: Detected Anomaly -->
  <rect x="300" y="50" width="200" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="400" y="75" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="black">DETECTED ANOMALY</text>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Unknown Pattern Input</text>
  <text x="510" y="65" font-family="Arial, sans-serif" font-size="10" fill="black">700</text>
  
  <line x1="400" y1="100" x2="400" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrow7)"/>
  
  <!-- Step 1: Pattern Analysis -->
  <rect x="250" y="130" width="300" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="black">1. PATTERN ANALYSIS (710)</text>
  <text x="400" y="175" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Voyager: detect_signal_precisely()</text>
  <text x="400" y="190" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Check against known_equations[]</text>
  
  <line x1="400" y1="200" x2="400" y2="230" stroke="black" stroke-width="2" marker-end="url(#arrow7)"/>
  
  <!-- Step 2: Mathematical Modeling -->
  <rect x="250" y="230" width="300" height="80" fill="white" stroke="black" stroke-width="2"/>
  <text x="400" y="255" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="black">2. MATHEMATICAL MODELING (720)</text>
  <text x="400" y="275" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">analyze_signal_mathematically()</text>
  <text x="400" y="290" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="black">Types: Linear | Polynomial | Periodic | Exponential | Custom</text>
  
  <line x1="400" y1="310" x2="400" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrow7)"/>
  
  <!-- Step 3: Equation Creation -->
  <rect x="250" y="340" width="300" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="black">3. EQUATION CREATION (730)</text>
  <text x="400" y="385" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">create_mathematical_equation()</text>
  <text x="400" y="400" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">SignalEquation { name, type, coefficients, tolerance }</text>
  
  <line x1="400" y1="410" x2="400" y2="440" stroke="black" stroke-width="2" marker-end="url(#arrow7)"/>
  
  <!-- Step 4: Dimensional Derivation -->
  <rect x="250" y="440" width="300" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="black">4. DIMENSIONAL DERIVATION (740)</text>
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">optimal_dim = 0.4×Hausdorff + 0.3×Box + 0.3×Info</text>
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">expand_dimensions_mathematically()</text>
  
  <line x1="400" y1="510" x2="400" y2="540" stroke="black" stroke-width="2" marker-end="url(#arrow7)"/>
  
  <!-- Output: Mathematical Explanation -->
  <rect x="200" y="540" width="400" height="80" fill="white" stroke="black" stroke-width="3"/>
  <text x="400" y="565" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="black">MATHEMATICAL EXPLANATION OUTPUT (750)</text>
  <text x="400" y="585" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">• Anomaly cause identification</text>
  <text x="400" y="600" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">• Mathematical proof of resolution</text>
  <text x="400" y="615" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">• Dimensional requirements analysis</text>
  
  <!-- Side Process: Mathematics Library -->
  <rect x="580" y="230" width="160" height="180" fill="white" stroke="black" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="660" y="255" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="black">PASSIVE MATH</text>
  <text x="660" y="270" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="black">LIBRARY (760)</text>
  <line x1="590" y1="280" x2="730" y2="280" stroke="black" stroke-width="1"/>
  <text x="660" y="300" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">pattern_matcher</text>
  <text x="660" y="320" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">formula_finder</text>
  <text x="660" y="340" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">compute_engine</text>
  <text x="660" y="360" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">knowledge_db</text>
  <text x="660" y="395" font-family="Arial, sans-serif" font-size="8" font-style="italic" text-anchor="middle" fill="black">(Responds on request)</text>
  
  <!-- Arrows to Math Library -->
  <line x1="550" y1="270" x2="580" y2="290" stroke="black" stroke-width="1" marker-end="url(#arrow7)"/>
  <line x1="550" y1="375" x2="580" y2="360" stroke="black" stroke-width="1" marker-end="url(#arrow7)"/>
  <line x1="580" y1="320" x2="550" y2="330" stroke="black" stroke-width="1" marker-end="url(#arrow7)"/>
  
  <!-- Fate Integration -->
  <rect x="60" y="280" width="140" height="100" fill="white" stroke="black" stroke-width="2"/>
  <text x="130" y="305" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="black">FATE (770)</text>
  <text x="130" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Coordination</text>
  <line x1="70" y1="335" x2="190" y2="335" stroke="black" stroke-width="1"/>
  <text x="130" y="355" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="black">w = intensity ×</text>
  <text x="130" y="370" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="black">quality_score</text>
  
  <line x1="200" y1="330" x2="250" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrow7)"/>
  
  <!-- Performance note -->
  <text x="400" y="640" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="black">
    Mathematical Explanation Coverage: 100% | New Equations Created: 8 per test session
  </text>
</svg>

