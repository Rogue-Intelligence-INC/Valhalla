<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550">
  <title>Figure 4 - Dimensional Expansion: Integer, Fractional, and Complex Dimensions</title>
  
  <!-- Background -->
  <rect width="800" height="550" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">
    FIG. 4 - DIMENSIONAL EXPANSION SUPPORT
  </text>
  
  <!-- Main Number Line -->
  <line x1="50" y1="200" x2="750" y2="200" stroke="black" stroke-width="3"/>
  
  <!-- Integer Dimension Markers -->
  <line x1="100" y1="185" x2="100" y2="215" stroke="black" stroke-width="2"/>
  <text x="100" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">1D</text>
  <circle cx="100" cy="200" r="8" fill="white" stroke="black" stroke-width="2"/>
  
  <line x1="250" y1="185" x2="250" y2="215" stroke="black" stroke-width="2"/>
  <text x="250" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">2D</text>
  <circle cx="250" cy="200" r="8" fill="white" stroke="black" stroke-width="2"/>
  
  <line x1="400" y1="185" x2="400" y2="215" stroke="black" stroke-width="2"/>
  <text x="400" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">3D</text>
  <circle cx="400" cy="200" r="8" fill="white" stroke="black" stroke-width="2"/>
  
  <line x1="550" y1="185" x2="550" y2="215" stroke="black" stroke-width="2"/>
  <text x="550" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">4D</text>
  <circle cx="550" cy="200" r="8" fill="white" stroke="black" stroke-width="2"/>
  
  <!-- Infinity -->
  <text x="720" y="205" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="black">∞D</text>
  <text x="720" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">(dynamic)</text>
  
  <!-- Fractional Dimension Markers -->
  <line x1="180" y1="190" x2="180" y2="210" stroke="black" stroke-width="1"/>
  <text x="180" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">φ≈1.618</text>
  <circle cx="180" cy="200" r="5" fill="black"/>
  
  <line x1="310" y1="190" x2="310" y2="210" stroke="black" stroke-width="1"/>
  <text x="310" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">e≈2.718</text>
  <circle cx="310" cy="200" r="5" fill="black"/>
  
  <line x1="175" y1="190" x2="175" y2="210" stroke="black" stroke-width="1"/>
  <text x="160" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">π/2≈1.571</text>
  <line x1="160" y1="252" x2="175" y2="210" stroke="black" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Three Dimension Type Boxes -->
  <rect x="50" y="300" width="200" height="120" fill="white" stroke="black" stroke-width="2"/>
  <text x="150" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">INTEGER DIMENSIONS</text>
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">1, 2, 3, 4, ... n</text>
  <line x1="70" y1="360" x2="230" y2="360" stroke="black" stroke-width="1"/>
  <text x="150" y="380" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Standard computational</text>
  <text x="150" y="395" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">space representation</text>
  <text x="260" y="315" font-family="Arial, sans-serif" font-size="10" fill="black">400</text>
  
  <rect x="300" y="300" width="200" height="120" fill="white" stroke="black" stroke-width="2"/>
  <text x="400" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">FRACTIONAL DIMENSIONS</text>
  <text x="400" y="345" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">π/2, φ, e, 2.5, ...</text>
  <line x1="320" y1="360" x2="480" y2="360" stroke="black" stroke-width="1"/>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Hausdorff dimension</text>
  <text x="400" y="395" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Fractal data structures</text>
  <text x="510" y="315" font-family="Arial, sans-serif" font-size="10" fill="black">410</text>
  
  <rect x="550" y="300" width="200" height="120" fill="white" stroke="black" stroke-width="2"/>
  <text x="650" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">COMPLEX DIMENSIONS</text>
  <text x="650" y="345" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">a + bi (real + imaginary)</text>
  <line x1="570" y1="360" x2="730" y2="360" stroke="black" stroke-width="1"/>
  <text x="650" y="380" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Quantum-like</text>
  <text x="650" y="395" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">superposition states</text>
  <text x="760" y="315" font-family="Arial, sans-serif" font-size="10" fill="black">420</text>
  
  <!-- Calculation Formula Box -->
  <rect x="200" y="450" width="400" height="70" fill="white" stroke="black" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="400" y="475" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="black">DIMENSION CALCULATION FORMULA (430)</text>
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">
    optimal_dim = 0.4×Hausdorff + 0.3×Box + 0.3×Information
  </text>
  
  <!-- Arrows showing expansion -->
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
  
  <line x1="100" y1="150" x2="250" y2="150" stroke="black" stroke-width="1" marker-end="url(#arrow4)"/>
  <text x="175" y="140" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">expand</text>
  
  <line x1="250" y1="150" x2="400" y2="150" stroke="black" stroke-width="1" marker-end="url(#arrow4)"/>
  <text x="325" y="140" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">expand</text>
  
  <line x1="400" y1="150" x2="550" y2="150" stroke="black" stroke-width="1" marker-end="url(#arrow4)"/>
  <text x="475" y="140" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">expand</text>
  
  <line x1="550" y1="150" x2="700" y2="150" stroke="black" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow4)"/>
  <text x="625" y="140" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">...</text>
  
  <!-- Connection lines to boxes -->
  <line x1="100" y1="208" x2="150" y2="300" stroke="black" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="180" y1="208" x2="400" y2="300" stroke="black" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- Reference labels -->
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="11" fill="black">Dynamic Dimension Expansion Rate: 0.231 dimensions/cycle</text>
</svg>

