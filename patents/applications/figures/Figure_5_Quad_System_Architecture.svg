<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <title>Figure 5 - Quad-System Architecture: Signal Flow and Coordination</title>
  
  <!-- Background -->
  <rect width="800" height="600" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">
    FIG. 5 - QUAD-SYSTEM ARCHITECTURE
  </text>
  
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
  
  <!-- BlackHole System (Top Left) -->
  <rect x="50" y="80" width="180" height="140" fill="white" stroke="black" stroke-width="2"/>
  <text x="140" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">BLACKHOLE (500)</text>
  <text x="140" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Gravitational Physics</text>
  <line x1="60" y1="135" x2="220" y2="135" stroke="black" stroke-width="1"/>
  <text x="140" y="155" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">deformation_intensity =</text>
  <text x="140" y="170" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="black">gravity×0.4 + curvature×0.3</text>
  <text x="140" y="185" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="black">+ horizon×0.2 + escape×0.1</text>
  <text x="140" y="205" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="black">424.12 µs avg</text>
  
  <!-- MultiNova System (Top Right) -->
  <rect x="570" y="80" width="180" height="140" fill="white" stroke="black" stroke-width="2"/>
  <text x="660" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">MULTINOVA (510)</text>
  <text x="660" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Stellar Evolution</text>
  <line x1="580" y1="135" x2="740" y2="135" stroke="black" stroke-width="1"/>
  <text x="660" y="155" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">energy_release =</text>
  <text x="660" y="170" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="black">10 + intensity×190</text>
  <text x="660" y="185" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="black">+ compression×50 + fusion×30</text>
  <text x="660" y="205" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="black">4.88 µs avg</text>
  
  <!-- MeshBrain System (Bottom Left) -->
  <rect x="50" y="380" width="180" height="140" fill="white" stroke="black" stroke-width="2"/>
  <text x="140" y="405" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">MESHBRAIN (520)</text>
  <text x="140" y="425" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Membrane Cognition</text>
  <line x1="60" y1="435" x2="220" y2="435" stroke="black" stroke-width="1"/>
  <text x="140" y="455" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Signal Types:</text>
  <text x="140" y="470" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="black">ContinuousFluctuation</text>
  <text x="140" y="485" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="black">StructuralReorganization</text>
  <text x="140" y="505" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="black">111.25 µs avg</text>
  
  <!-- BaseForce System (Bottom Right) -->
  <rect x="570" y="380" width="180" height="140" fill="white" stroke="black" stroke-width="2"/>
  <text x="660" y="405" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">BASEFORCE (530)</text>
  <text x="660" y="425" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Signal Coordination</text>
  <line x1="580" y1="435" x2="740" y2="435" stroke="black" stroke-width="1"/>
  <text x="660" y="455" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">Functions:</text>
  <text x="660" y="470" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="black">Detect + Aggregate</text>
  <text x="660" y="485" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="black">+ Preprocess → Fate</text>
  <text x="660" y="505" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="black">0.11 µs avg (fastest)</text>
  
  <!-- FATE Central Hub -->
  <ellipse cx="400" cy="300" rx="100" ry="60" fill="white" stroke="black" stroke-width="3"/>
  <text x="400" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="black">FATE (540)</text>
  <text x="400" y="310" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="black">Unified Coordination</text>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">w = intensity × quality</text>
  
  <!-- Signal Flow Arrows -->
  <!-- BlackHole to Fate -->
  <line x1="230" y1="150" x2="310" y2="270" stroke="black" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="255" y="200" font-family="Arial, sans-serif" font-size="8" fill="black">[1,0,0,0]</text>
  
  <!-- MultiNova to Fate -->
  <line x1="570" y1="150" x2="490" y2="270" stroke="black" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="540" y="200" font-family="Arial, sans-serif" font-size="8" fill="black">[0,0,1,0]</text>
  
  <!-- MeshBrain to Fate -->
  <line x1="230" y1="450" x2="310" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="255" y="400" font-family="Arial, sans-serif" font-size="8" fill="black">[0,1,0,0]</text>
  
  <!-- BaseForce to Fate -->
  <line x1="570" y1="450" x2="490" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="540" y="400" font-family="Arial, sans-serif" font-size="8" fill="black">[0,0,0,1]</text>
  
  <!-- Interconnections (BaseForce to others) -->
  <line x1="570" y1="420" x2="230" y2="180" stroke="black" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="570" y1="420" x2="570" y2="220" stroke="black" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="570" y1="450" x2="230" y2="450" stroke="black" stroke-width="1" stroke-dasharray="5,3"/>
  
  <!-- 4D Affinity Vector Output -->
  <rect x="300" y="380" width="200" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="400" y="400" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="black">4D AFFINITY VECTOR (550)</text>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="black">[BH, MB, MN, BF] = Σ(d×w)/Σw</text>
  
  <line x1="400" y1="360" x2="400" y2="380" stroke="black" stroke-width="2" marker-end="url(#arrow5)"/>
  
  <!-- Design Philosophy -->
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="black">
    Design Philosophy: Quality Part → Physical Space Deformation → Deformation IS Signal
  </text>
</svg>

