xt><rect x="650" y="100" width="250" height="200" rx="15" fill="url(#spaceGradient)" stroke="#C0392B" stroke-width="2" /><text x="775" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">动态资源分配</text><text x="775" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 需求预测</text><text x="775" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 资源池管理</text><text x="775" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 分配优化</text><text x="775" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 回收机制</text><text x="775" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 负载均衡</text><text x="775" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 性能监控</text><rect x="950" y="100" width="200" height="200" rx="15" fill="url(#spaceGradient)" stroke="#C0392B" stroke-width="2" /><text x="1050" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">空间优化算法</text><text x="1050" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 布局优化</text><text x="1050" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 访问优化</text><text x="1050" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 空间压缩</text><text x="1050" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 碎片整理</text><text x="1050" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 索引优化</text><text x="1050" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 缓存管理</text><line x1="300" y1="200" x2="350" y2="200" stroke="#2c3e50" stroke-width="2" marker-end="url