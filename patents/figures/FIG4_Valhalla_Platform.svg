<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">
    FIG. 4 - Valhalla Unified Platform Architecture
  </text>
  
  <!-- Integration Components at Top -->
  <rect x="50" y="60" width="180" height="70" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1976d2">Wave Engine</text>
  <text x="140" y="110" text-anchor="middle" font-size="10" fill="#666">Self-hosting Compiler</text>
  
  <rect x="260" y="60" width="180" height="70" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="350" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#388e3c">S-wind</text>
  <text x="350" y="110" text-anchor="middle" font-size="10" fill="#666">Exact Computation</text>
  
  <rect x="470" y="60" width="180" height="70" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="560" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2185b">Val-OS</text>
  <text x="560" y="110" text-anchor="middle" font-size="10" fill="#666">Adaptive System</text>
  
  <!-- Valhalla Core -->
  <rect x="680" y="60" width="180" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="770" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Valhalla Core</text>
  <text x="770" y="110" text-anchor="middle" font-size="10" fill="#666">Unified Platform</text>
  
  <!-- Arrows to Valhalla -->
