  <text x="200" y="500" font-size="12" fill="#333">Expr ::= Num(Rational) | Sym(Variable) | Const(Physics)</text>
  <text x="200" y="520" font-size="12" fill="#333">        | Add | Sub | Mul | Div | Pow | Sqrt | Diff</text>
  
