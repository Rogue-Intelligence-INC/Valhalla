  <line x1="160" y1="420" x2="300" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="400" x2="400" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="400" x2="640" y2="420" stroke="#333" stroke-width="1.5"/>
  <line x1="640" y1="420" x2="500" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Results -->
