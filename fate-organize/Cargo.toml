[package]
name = "fate-organize"
version = "1.0.0"
edition = "2021"
description = "Fate Organizer - Valhalla 智能文件整理系统 (把 Hub 反过来用)"
authors = ["Valhalla Research Team"]
license = "MIT"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }

[lib]
name = "fate_organize"
path = "src/lib.rs"

[[bin]]
name = "fate-organize"
path = "src/bin/main.rs"
