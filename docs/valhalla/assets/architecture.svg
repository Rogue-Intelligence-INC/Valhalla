<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc">
  <title id="title">ValhallaBase product architecture</title>
  <desc id="desc">Signal ingress through Fate into Triad Hub Tile StemCell fragments, optional LM decode, Unique Proofs U1-U4 mapped to body and gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf8"/>
      <stop offset="100%" stop-color="#f0f0ec"/>
    </linearGradient>
    <linearGradient id="fate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c2a4a"/>
      <stop offset="100%" stop-color="#3a4a6a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c2a4a"/>
    </marker>
    <style type="text/css"><![CDATA[
      .lbl { font-family: Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .muted { fill: #5c5c5c; }
      .title { font-family: Georgia, "Times New Roman", serif; font-weight: 600; fill: #1a1a1a; }
      .mono { font-family: Menlo, Consolas, monospace; fill: #1c2a4a; }
      .w { fill: #fafaf8; font-family: Helvetica, Arial, sans-serif; }
    ]]></style>
  </defs>

  <rect width="920" height="640" fill="url(#bg)"/>
  <text class="title" x="40" y="42" font-size="26">ValhallaBase - product architecture</text>
  <text class="lbl muted" x="40" y="64" font-size="13">Structure body first · LM optional · Unique Proofs map to physiology + gates</text>

  <!-- Layer labels left -->
  <text class="mono" x="28" y="118" font-size="11" transform="rotate(-90 28 118)">INGRESS</text>
  <text class="mono" x="28" y="250" font-size="11" transform="rotate(-90 28 250)">FATE</text>
  <text class="mono" x="28" y="400" font-size="11" transform="rotate(-90 28 400)">TRIAD BODY</text>
  <text class="mono" x="28" y="545" font-size="11" transform="rotate(-90 28 545)">DECODE</text>

  <!-- Ingress -->
  <rect x="56" y="88" width="600" height="72" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text class="lbl" x="72" y="114" font-size="14" font-weight="600">Multimodal signal ingress</text>
  <g>
    <rect x="72" y="126" width="110" height="22" rx="2" fill="#f0f0ec" stroke="#c8c8c4"/>
    <text class="lbl" x="127" y="141" font-size="11" text-anchor="middle">Text</text>
    <rect x="194" y="126" width="110" height="22" rx="2" fill="#f0f0ec" stroke="#c8c8c4"/>
    <text class="lbl" x="249" y="141" font-size="11" text-anchor="middle">TTS / audio</text>
    <rect x="316" y="126" width="110" height="22" rx="2" fill="#f0f0ec" stroke="#c8c8c4"/>
    <text class="lbl" x="371" y="141" font-size="11" text-anchor="middle">Image</text>
    <rect x="438" y="126" width="190" height="22" rx="2" fill="#f0f0ec" stroke="#c8c8c4"/>
    <text class="lbl" x="533" y="141" font-size="11" text-anchor="middle">session_extend · append</text>
  </g>
  <text class="mono" x="72" y="178" font-size="10">U1 - shared body (non-isolated)</text>

  <!-- Arrow down -->
  <line x1="356" y1="160" x2="356" y2="188" stroke="#1c2a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fate -->
  <rect x="56" y="190" width="600" height="100" rx="4" fill="url(#fate)"/>
  <text class="w" x="72" y="216" font-size="14" font-weight="600">Fate circulation</text>
  <text class="w" x="72" y="236" font-size="11" opacity="0.85">quad_cycle · affinity · relative addressing · FOG gate</text>
  <g>
    <rect x="72" y="248" width="120" height="28" rx="2" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.45"/>
    <text class="w" x="132" y="266" font-size="10" text-anchor="middle" style="font-family:Menlo,Consolas,monospace">BlackHole</text>
    <rect x="206" y="248" width="120" height="28" rx="2" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.45"/>
    <text class="w" x="266" y="266" font-size="10" text-anchor="middle" style="font-family:Menlo,Consolas,monospace">MeshBrain</text>
    <rect x="340" y="248" width="120" height="28" rx="2" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.45"/>
    <text class="w" x="400" y="266" font-size="10" text-anchor="middle" style="font-family:Menlo,Consolas,monospace">MultiNova</text>
    <rect x="474" y="248" width="120" height="28" rx="2" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.45"/>
    <text class="w" x="534" y="266" font-size="10" text-anchor="middle" style="font-family:Menlo,Consolas,monospace">BaseForce</text>
  </g>
  <text class="w" x="72" y="292" font-size="10" style="font-family:Menlo,Consolas,monospace">U2 - proactive + abstain (FOG)</text>

  <line x1="356" y1="290" x2="356" y2="318" stroke="#1c2a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Triad body / fragments -->
  <rect x="56" y="320" width="600" height="180" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text class="lbl" x="72" y="346" font-size="14" font-weight="600">Triad body · fragment_full</text>
  <text class="lbl muted" x="72" y="364" font-size="11">Structure lives in fragments · compact top-level snapshot by design</text>

  <!-- Hub -->
  <rect x="72" y="380" width="170" height="100" rx="3" fill="#fafaf8" stroke="#1c2a4a" stroke-width="1.2"/>
  <text class="lbl" x="157" y="404" font-size="13" font-weight="600" text-anchor="middle">Hub</text>
  <text class="lbl muted" x="157" y="424" font-size="10" text-anchor="middle">quad balance</text>
  <text class="lbl muted" x="157" y="440" font-size="10" text-anchor="middle">routing prefs</text>
  <text class="mono" x="157" y="462" font-size="9" text-anchor="middle">D1 · quad_cycle</text>

  <!-- Tile -->
  <rect x="262" y="380" width="170" height="100" rx="3" fill="#fafaf8" stroke="#1c2a4a" stroke-width="1.2"/>
  <text class="lbl" x="347" y="404" font-size="13" font-weight="600" text-anchor="middle">Tile</text>
  <text class="lbl muted" x="347" y="424" font-size="10" text-anchor="middle">completed_tiles</text>
  <text class="lbl muted" x="347" y="440" font-size="10" text-anchor="middle">activation · edges</text>
  <text class="mono" x="347" y="462" font-size="9" text-anchor="middle">L1-L3 train target</text>

  <!-- Stem -->
  <rect x="452" y="380" width="180" height="100" rx="3" fill="#fafaf8" stroke="#1c2a4a" stroke-width="1.2"/>
  <text class="lbl" x="542" y="404" font-size="13" font-weight="600" text-anchor="middle">StemCell</text>
  <text class="lbl muted" x="542" y="424" font-size="10" text-anchor="middle">emergent organs</text>
  <text class="lbl muted" x="542" y="440" font-size="10" text-anchor="middle">sigma · coalescence</text>
  <text class="mono" x="542" y="462" font-size="9" text-anchor="middle">no preset catalog</text>

  <text class="mono" x="72" y="502" font-size="10">U3 - zero-weight pollution rescue · U4 - backbone-orthogonal open path</text>

  <line x1="356" y1="500" x2="356" y2="528" stroke="#1c2a4a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decode -->
  <rect x="56" y="530" width="280" height="72" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text class="lbl" x="72" y="556" font-size="13" font-weight="600">Optional LM decode head</text>
  <text class="lbl muted" x="72" y="576" font-size="11">hybrid · structure_fate · swappable SKU</text>
  <text class="mono" x="72" y="594" font-size="10">default 0.5B · not the product SKU</text>

  <rect x="352" y="530" width="304" height="72" rx="4" fill="#f0f0ec" stroke="#c8c8c4"/>
  <text class="lbl" x="368" y="556" font-size="13" font-weight="600">Native / FOG answer path</text>
  <text class="lbl muted" x="368" y="576" font-size="11">structure alignment · abstain · audit trail</text>
  <text class="mono" x="368" y="594" font-size="10">continuity: drift 0% · retention 100%</text>

  <!-- Right rail: Unique Proofs -->
  <rect x="680" y="88" width="208" height="514" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text class="lbl" x="698" y="118" font-size="13" font-weight="600">Unique Proofs</text>
  <text class="lbl muted" x="698" y="136" font-size="10">lead diligence · U1-U4</text>

  <rect x="698" y="156" width="172" height="72" rx="3" fill="#fafaf8" stroke="#1c2a4a"/>
  <text class="mono" x="710" y="176" font-size="11">U1</text>
  <text class="lbl" x="710" y="194" font-size="11">Non-isolated</text>
  <text class="lbl muted" x="710" y="210" font-size="10">multimodal body</text>

  <rect x="698" y="240" width="172" height="72" rx="3" fill="#fafaf8" stroke="#1c2a4a"/>
  <text class="mono" x="710" y="260" font-size="11">U2</text>
  <text class="lbl" x="710" y="278" font-size="11">Proactive + abstain</text>
  <text class="lbl muted" x="710" y="294" font-size="10">FOG · MAR / FIR</text>

  <rect x="698" y="324" width="172" height="72" rx="3" fill="#fafaf8" stroke="#1c2a4a"/>
  <text class="mono" x="710" y="344" font-size="11">U3</text>
  <text class="lbl" x="710" y="362" font-size="11">Pollution rescue</text>
  <text class="lbl muted" x="710" y="378" font-size="10">zero-weight transfer</text>

  <rect x="698" y="408" width="172" height="72" rx="3" fill="#fafaf8" stroke="#1c2a4a"/>
  <text class="mono" x="710" y="428" font-size="11">U4</text>
  <text class="lbl" x="710" y="446" font-size="11">Backbone orthogonal</text>
  <text class="lbl muted" x="710" y="462" font-size="10">independent open path</text>

  <text class="lbl muted" x="698" y="512" font-size="10">U5 cost@floor - footnote</text>
  <text class="lbl muted" x="698" y="528" font-size="10">until accuracy floor passes</text>
  <text class="lbl muted" x="698" y="560" font-size="10">holdout 100% · interleave 75%</text>
  <text class="lbl muted" x="698" y="576" font-size="10">protocol pass · not LoCoMo SOTA</text>

  <text class="lbl muted" x="40" y="628" font-size="10">Rogue Intelligence LNC. · Valhalla Unified Core · not open source · 2026-07-14</text>
</svg>
