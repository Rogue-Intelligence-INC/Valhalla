[package]
name = "fate-f64"
version = "1.0.0"
edition = "2021"
description = "Fate System - f64 GPU-Accelerated Version"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"  # 仅用于调试
bincode = "1.3"     # Rust 原生二进制序列化
log = "0.4"
rayon = "1.10"

# GPU acceleration (optional, enable with feature)
candle-core = { version = "0.8", optional = true }

[features]
default = []
cuda = ["candle-core"]
native_cuda = []  # Direct CUDA FFI, supports CUDA 13.1+