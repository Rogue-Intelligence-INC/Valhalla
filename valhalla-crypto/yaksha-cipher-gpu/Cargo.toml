[package]
name = "yaksha-cipher-gpu"
version = "1.0.0"
edition = "2021"
description = "GPU-accelerated Yaksha Cipher using wgpu/Vulkan"
license = "MIT"

[dependencies]
# GPU compute (ocean XOR offload only)
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }

# Core cipher — bodies, cascade, ocean stream math
yaksha-cipher = { path = "../yaksha-cipher" }

[features]
default = []
experimental = []

[dev-dependencies]
rand = "0.8"

[[bin]]
name = "gpu_bench"
path = "src/bin/gpu_bench.rs"

[[bin]]
name = "gpu_test"
path = "src/bin/gpu_test.rs"

[[bin]]
name = "generate_gpu_data"
path = "src/bin/generate_gpu_data.rs"

[[bin]]
name = "gpu_fate_neural_test"
path = "src/bin/gpu_fate_neural_test.rs"

[[bin]]
name = "gpu_fate_neural_bench"
path = "src/bin/gpu_fate_neural_bench.rs"

[[bin]]
name = "generate_test_data_gpu"
path = "src/bin/generate_test_data_gpu.rs"

[[bin]]
name = "strict_test_gpu"
path = "src/bin/strict_test_gpu.rs"

[[bin]]
name = "yaksha_test_gpu"
path = "src/bin/yaksha_test_gpu.rs"

[[bin]]
name = "cpu_gpu_compat"
path = "src/bin/cpu_gpu_compat.rs"

[[bin]]
name = "test_random_cascade"
path = "src/bin/test_random_cascade.rs"
required-features = ["experimental"]

[[bin]]
name = "test_quantum_diffusion"
path = "src/bin/test_quantum_diffusion.rs"
required-features = ["experimental"]

[[bin]]
name = "test_rounds"
path = "src/bin/test_rounds.rs"
required-features = ["experimental"]

