[package]
name = "valhalla_space"
version = "0.1.0"
edition = "2021"
description = "Valhalla Space - 基于 Voyager 的容器构建系统"

[dependencies]
fate = { path = "../../systems/metasystems/fate" }
voyager = { path = "../voyager" }
valhalla_mathematics = { path = "../mathematics" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
