<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .title { font-family: Arial; font-size: 18px; font-weight: bold; fill: #2c3e50; text-anchor: middle; }
    .subtitle { font-family: Arial; font-size: 14px; fill: #34495e; text-anchor: middle; }
    .system { font-family: Arial; font-size: 12px; fill: #2c3e50; }
    .arrow { stroke: #3498db; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; rx: 8; }
    .fate-box { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; rx: 8; }
    .voyager-box { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 8; }
    .space-box { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; rx: 8; }
    .quad-box { fill: #f39c12; stroke: #e67e22; stroke-width: 2; rx: 8; }
    .white-text { fill: white; font-family: Arial; font-size: 11px; font-weight: bold; text-anchor: middle; }
  </style>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
  </marker>
</defs>

<!-- 标题 -->
<text x="400" y="30" class="title">Valhalla核心架构层级：Space ← Voyager ← Fate</text>
<text x="400" y="50" class="subtitle">数据处理就是形变，优质信号捕捉是加强优化加速行为</text>

<!-- Fate系统 -->
<rect x="50" y="100" width="150" height="80" class="fate-box"/>
<text x="125" y="125" class="white-text">Fate</text>
<text x="125" y="140" class="white-text">统一数学公式</text>
<text x="125" y="155" class="white-text">weight = intensity</text>
<text x="125" y="170" class="white-text">× quality_score</text>

<!-- Voyager系统 -->
<rect x="250" y="100" width="150" height="80" class="voyager-box"/>
<text x="325" y="125" class="white-text">Voyager</text>
<text x="325" y="140" class="white-text">维度管理</text>
<text x="325" y="155" class="white-text">未知行为收集</text>
<text x="325" y="170" class="white-text">数学计算库</text>

<!-- Space系统 -->
<rect x="450" y="100" width="150" height="80" class="space-box"/>
<text x="525" y="125" class="white-text">Space</text>
<text x="525" y="140" class="white-text">统一容器</text>
<text x="525" y="155" class="white-text">基础设施</text>
<text x="525" y="170" class="white-text">维度构建</text>

<!-- 四大元系统 -->
<rect x="650" y="100" width="120" height="80" class="quad-box"/>
<text x="710" y="125" class="white-text">四大元系统</text>
<text x="710" y="140" class="white-text">数据处理</text>
<text x="710" y="155" class="white-text">机制</text>

<!-- 箭头 -->
<line x1="200" y1="140" x2="250" y2="140" class="arrow"/>
<line x1="400" y1="140" x2="450" y2="140" class="arrow"/>
<line x1="600" y1="140" x2="650" y2="140" class="arrow"/>

<!-- 核心理念说明 -->
<text x="50" y="220" class="subtitle" text-anchor="start">核心理念纠正：</text>
<text x="50" y="250" class="system">❌ 四大元系统是信号生成器</text>
<text x="50" y="270" class="system">✅ 四大元系统是优秀的数据处理机制</text>
<text x="50" y="300" class="system">❌ 优质信号捕捉是产生信号</text>
<text x="50" y="320" class="system">✅ 优质信号捕捉是加强优化，加速行为</text>
<text x="50" y="350" class="system">❌ 系统专门生成形变信号</text>
<text x="50" y="370" class="system">✅ 数据处理过程本身就是形变</text>

<!-- 性能数据 -->
<text x="50" y="420" class="subtitle" text-anchor="start">性能验证：</text>
<text x="50" y="440" class="system">• Fate: >10K ops/sec, CPU 0.05%</text>
<text x="50" y="455" class="system">• 四大系统处理时间: 0.11µs - 424.12µs</text>
<text x="50" y="470" class="system">• 统一维度构建: 减少60%内存使用</text>

</svg> 