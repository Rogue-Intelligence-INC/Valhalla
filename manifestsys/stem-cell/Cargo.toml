[package]
name = "stem-cell"
version = "1.0.0"
edition = "2021"
description = "Stem Cell Network - f64 Performance Version"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
log = "0.4"

# 系统存储 (保留兼容)
valhalla-storage = { path = "../valhalla-storage" }

# f64 metasystems
valhalla_metasystems_blackhole = { path = "../../systems/metasystems/blackhole" }
valhalla_metasystems_meshbrain = { path = "../../systems/metasystems/meshbrain" }
valhalla_metasystems_multinova = { path = "../../systems/metasystems/multinova" }
valhalla_metasystems_baseforce = { path = "../../systems/metasystems/base-force" }

# Triple-Fate (多层 Fate 架构)
fate-f64 = { path = "../../systems/metasystems/fate-f64" }

# Space GPU 高维计算
valhalla-space-f64-gpu = { path = "../../utils/space-f64-gpu" }
