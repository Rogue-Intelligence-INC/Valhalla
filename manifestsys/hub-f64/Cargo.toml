[package]
name = "hub-f64"
version = "1.1.0"
edition = "2021"
description = "Valhalla Hub System - f64 GPU-Accelerated Performance Version"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
log = "0.4"
uuid = { version = "1.0", features = ["v4"] }
rayon = "1.10"
num_cpus = "1.16"
ctrlc = "3.4"
rand = "0.8"
bzip2 = "0.4"
chrono = "0.4"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
futures = "0.3"

# f64 metasystems with native CUDA (supports CUDA 13.1 / RTX 4090)
fate-f64 = { path = "../../systems/metasystems/fate-f64", features = ["native_cuda"] }
fate = { path = "../../systems/metasystems/fate" }
valhalla_metasystems_blackhole = { path = "../../systems/metasystems/blackhole" }
valhalla_metasystems_meshbrain = { path = "../../systems/metasystems/meshbrain" }
valhalla_metasystems_multinova = { path = "../../systems/metasystems/multinova" }
valhalla_metasystems_baseforce = { path = "../../systems/metasystems/base-force" }

# 其他系统
stem-cell = { path = "../stem-cell" }
valhalla-tile-quattro = { path = "../tile-quattro" }
chamber = { path = "../chamber" }

# 系统存储
valhalla-storage = { path = "../valhalla-storage" }

# Space GPU 高维计算
valhalla-space-f64-gpu = { path = "../../utils/space-f64-gpu" }

# Tier A patch LM (optional — full Rust hybrid)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.20", optional = true }

[features]
default = ["patch-lm"]
patch-lm = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[[bin]]
name = "valhalla_dl_front_smoke"
path = "src/bin/valhalla_dl_front_smoke.rs"

