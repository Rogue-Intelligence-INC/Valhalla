[package]
name = "chamber"
version = "0.1.0"
edition = "2021"
description = "Chamber - 高级容器编排系统"

[dependencies]
valhalla_space = { path = "../../utils/space" }
fate = { path = "../../systems/metasystems/fate" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
log = "0.4"
uuid = { version = "1.0", features = ["v4"] }

# 系统存储 (旧版兼容)
valhalla-storage = { path = "../valhalla-storage" }

# Triple-Fate (多层 Fate 架构)
fate-f64 = { path = "../../systems/metasystems/fate-f64" }

# Space GPU 高维计算
valhalla-space-f64-gpu = { path = "../../utils/space-f64-gpu" }
